<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hidayah – Prayer Times, Qur'an &amp; Islamic Calendar</title>
    <meta name="description" content="Accurate prayer times, Qur'an reader with translations, Islamic calendar, and Islamic books — all in one place." />
    <meta name="theme-color" content="#16a34a" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Fonts are self-hosted: imported in src/main.jsx from @fontsource packages. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply dark class before React mounts to avoid flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('app_dark_mode');
          var dark = stored !== null
            ? stored === 'true'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
